name: backendllm

# Usage (one variant at a time, both serve the API on :8080):
#   docker compose --profile sync up -d --build
#   docker compose --profile queue up -d --build

x-chat-image: &chat-image
  build: ./chat-app
  image: backendllm/chat-app:local

x-chat-env: &chat-env
  DB_URL: jdbc:postgresql://postgres:5432/chat
  DB_USER: chat
  DB_PASSWORD: chat
  DB_POOL_SIZE: ${DB_POOL_SIZE}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_POOL_MAX: ${REDIS_POOL_MAX}
  LLM_BASE_URL: http://llm-mock:9000/v1
  RABBIT_HOST: rabbitmq

services:
  # --- Infrastructure (no resource limits) ------------------------------------
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.6
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  llm-mock:
    build: ./llm-mock
    image: backendllm/llm-mock:local
    environment:
      MIN_DELAY_MS: ${LLM_MIN_DELAY_MS}
      MAX_DELAY_MS: ${LLM_MAX_DELAY_MS}
      ERROR_RATE: ${LLM_ERROR_RATE}
    ports: ["9000:9000"]

  rabbitmq:
    image: rabbitmq:4.3-management
    profiles: [queue]
    ports: ["5672:5672", "15672:15672", "15692:15692"]
    volumes:
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./observability/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-prometheus.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Variant 1: sync (1 CPU / 1 GB) ------------------------------------------
  chat-sync:
    <<: *chat-image
    container_name: chat-sync
    profiles: [sync]
    environment:
      <<: *chat-env
      APP_MODE: sync
    ports: ["8080:8080"]
    cpus: ${SYNC_CPUS}
    mem_limit: ${SYNC_MEM}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      llm-mock: { condition: service_healthy }

  # --- Variant 2: queue (API + worker share 1 CPU / 1 GB) ----------------------
  chat-api:
    <<: *chat-image
    container_name: chat-api
    profiles: [queue]
    environment:
      <<: *chat-env
      APP_MODE: api
    ports: ["8080:8080"]
    cpus: ${API_CPUS}
    mem_limit: ${API_MEM}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  chat-worker:
    <<: *chat-image
    container_name: chat-worker
    profiles: [queue]
    environment:
      <<: *chat-env
      APP_MODE: worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
    cpus: ${WORKER_CPUS}
    mem_limit: ${WORKER_MEM}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      llm-mock: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # --- Observability (no resource limits) --------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.92.0
    environment:
      REDIS_ADDR: redis://redis:6379
    ports: ["9121:9121"]
    depends_on:
      redis: { condition: service_healthy }

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    devices: ["/dev/kmsg"]
    command: ["--docker_only=true", "--housekeeping_interval=5s"]
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports: ["8088:8080"]

  prometheus:
    image: prom/prometheus:v3.9.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
